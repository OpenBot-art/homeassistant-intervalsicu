[project]
name = "homeassistant-intervalsicu"
version = "0.2.0"
description = "Intervals.icu integration for Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "homeassistant",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "aiohttp",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The integration imports `custom_components.intervals_icu`, so the repository
# root has to be on sys.path for the tests to resolve it.
pythonpath = ["."]
